services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash
      POSTGRES_DB: flash
    ports:
      # The default is the port the image normally uses. Set POSTGRES_PORT in
      # .env where another Postgres already holds 5432 on your box.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # This directory runs only when the data directory is empty, so a schema
      # change needs `npm run db:down` before `npm run db:up`.
      - ./server/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash -d flash"]
      interval: 2s
      timeout: 3s
      retries: 20
